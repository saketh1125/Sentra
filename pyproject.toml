[project]
name = "sentra"
version = "0.1.0"
description = "Sentra — engineering trust platform (FastAPI + pgvector)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "tree_sitter==0.25.2",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "fastembed>=0.5",
    "onnxruntime>=1.18",
    "numpy>=1.26",
    "cvss>=2.6",
    "requests>=2.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.alembic]
script_location = "alembic"
